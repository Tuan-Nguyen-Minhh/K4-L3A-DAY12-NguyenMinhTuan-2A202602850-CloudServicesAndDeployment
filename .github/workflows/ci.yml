name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run checkpoint tests (CP1-CP4, no deploy)
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: pytest tests/test_cp1.py tests/test_cp2.py tests/test_cp3.py tests/test_cp4.py -v -m "not docker" --ignore=tests/test_cp5.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t day12-agent:ci .

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Wait for Railway auto-deploy
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ vars.PUBLIC_URL }}/health"; then
              echo "service is up"; break
            fi
            echo "waiting for deploy... ($i/20)"; sleep 30
          done
      - name: Smoke test
        run: |
          curl -fsS "${{ vars.PUBLIC_URL }}/health"
          curl -fsS "${{ vars.PUBLIC_URL }}/ready"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "${{ vars.PUBLIC_URL }}/ask" -H 'Content-Type: application/json' -d '{"question":"Hello"}')" = "401"
